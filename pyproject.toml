[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "distributed-task-queue"
version = "0.1.0"
description = "Asynchronous job processing service: REST API, Postgres job store and Redis-backed workers."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115,<1.0",
    "prometheus-client>=0.20,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy>=2.0.30,<2.2",
    "psycopg[binary]>=3.1,<4.0",
    "redis>=5.0,<9.0",
    "pydantic[email]>=2.7,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "pyjwt>=2.8,<3.0",
    "bcrypt>=4.1,<6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "fakeredis>=2.23",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# str+Enum mixins are deliberate: .value is stored in the database while str()
# stays stable for logging.
ignore = ["UP042"]
