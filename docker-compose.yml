services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: taskqueue
      POSTGRES_PASSWORD: taskqueue
      POSTGRES_DB: taskqueue
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Loopback only: nothing outside this host needs the database socket.
    ports:
      - "127.0.0.1:5432:5432"
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskqueue -d taskqueue"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # Redis is only a wake-up channel; job state lives in Postgres, so
    # persistence is switched off here.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    command:
      - sh
      - -c
      - python -m app.cli init-db && uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment: &app-env
      DATABASE_URL: postgresql+psycopg://taskqueue:taskqueue@postgres:5432/taskqueue
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me}
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-1.0}
      DEFAULT_MAX_ATTEMPTS: ${DEFAULT_MAX_ATTEMPTS:-3}
    # Published on loopback for curl and an SSH tunnel; Prometheus scrapes this
    # container directly over the shared monitoring network instead.
    ports:
      - "127.0.0.1:8000:8000"
    mem_limit: 256m
    networks:
      default: {}
      monitoring:
        aliases: [taskqueue-api]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    environment: *app-env
    mem_limit: 128m
    # The image healthcheck probes the API's HTTP port, which a worker does not
    # serve; without this the container reports unhealthy while working fine.
    healthcheck:
      disable: true
    deploy:
      replicas: 2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

networks:
  # Created by the monitoring stack (docker-compose.yml there sets name:
  # monitoring). Joining it lets Prometheus scrape this API by service name.
  monitoring:
    external: true
    name: monitoring_default

volumes:
  pgdata:
